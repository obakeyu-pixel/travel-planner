workflows:
  ios-release:
    name: 旅ぷらん iOS App Store Release
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      node: 20.x
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install
      - name: Build web application
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Set up code signing settings
        script: |
          xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - user_1
        notify:
          failure: true
          success: true
