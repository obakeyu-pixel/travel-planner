name: Build Mobile Apps (iOS & Android)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  # ========================================================
  # 1. Android アプリの自動ビルド (Google Play 用 .aab & テスト用 .apk)
  # ========================================================
  build-android:
    name: 🤖 Build Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK & AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload Android App Bundle & APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-App-Files
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

  # ========================================================
  # 2. iOS アプリの自動ビルド (クラウドMac / App Store 用)
  # ========================================================
  build-ios:
    name: 🍏 Build iOS App (Cloud macOS)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS App with Xcode
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            archive -archivePath ./build/App.xcarchive

      - name: Upload iOS App Archive
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-App-Archive
          path: ios/App/build/App.xcarchive
          retention-days: 14
