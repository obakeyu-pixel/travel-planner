name: Build Mobile Apps (iOS & Android)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  # ========================================================
  # 1. Android アプリの自動ビルド (実機インストール用 APK & バンドル)
  # ========================================================
  build-android:
    name: 🤖 Build Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx @capacitor/cli sync android

      - name: Make gradlew executable & fix line endings
        run: |
          sed -i -e 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Build Android APK (Debug & Unsigned Release)
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK (ダウンロードしてスマホで動かせるアプリ)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-App-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # ========================================================
  # 2. iOS アプリの自動ビルド (クラウドMac / iPhone用)
  # ========================================================
  build-ios:
    name: 🍏 Build iOS App (Cloud macOS)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx @capacitor/cli sync ios

      - name: Build iOS App with Xcode
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Upload iOS App Build
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-App-Build
          path: ios/App/build
          retention-days: 14
