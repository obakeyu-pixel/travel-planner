name: Build & Release iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ios:
    name: 🍏 Build & Upload iOS App to App Store Connect
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx @capacitor/cli sync ios

      - name: Build & Upload to App Store Connect
        working-directory: ios/App
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p fastlane
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > fastlane/AuthKey.p8
          defaults write com.apple.dt.Xcode IDEDefaultPackageSupportSCMProvider system
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
          fastlane release

      - name: Upload iOS App IPA Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-App-IPA
          path: |
            ios/App/build-output/*.ipa
            ~/Library/Logs/gym/*.log
            ~/Library/Logs/fastlane/*.log
          retention-days: 14
